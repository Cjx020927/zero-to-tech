<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵动手序 · 鼠标交互 3D 粒子系统</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05060a;
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    -webkit-user-select:none; user-select:none; }
  #stage { position:fixed; inset:0; }
  canvas { display:block; }

  /* ---------- 顶部标题 ---------- */
  #brand { position:fixed; top:18px; left:22px; z-index:10; color:#e8ecf4; pointer-events:none; }
  #brand h1 { font-size:17px; font-weight:600; letter-spacing:2px; opacity:.92; }
  #brand p  { font-size:11px; letter-spacing:1px; opacity:.45; margin-top:3px; }

  /* ---------- 摄像头预览（UI保留，内容隐藏） ---------- */
  #camWrap { position:fixed; top:16px; right:16px; z-index:10; width:148px; border-radius:12px;
    overflow:hidden; border:1px solid rgba(255,255,255,.14); box-shadow:0 6px 24px rgba(0,0,0,.5);
    background:rgba(10,12,20,.6); backdrop-filter:blur(8px); }
  #camWrap video, #camWrap canvas { display:none; }
  #camState { font-size:10px; color:#9fb0d0; text-align:center; padding:4px 0 6px; letter-spacing:1px; }
  #camState.on { color:#5eead4; }

  /* ---------- 主控面板 ---------- */
  #panel { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:10;
    display:flex; flex-direction:column; align-items:center; gap:12px; }
  .glass { background:rgba(14,17,28,.55); backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.10); border-radius:18px;
    box-shadow:0 10px 40px rgba(0,0,0,.45); }

  #models { display:flex; gap:6px; padding:8px; flex-wrap:wrap; justify-content:center; max-width:92vw; }
  .mbtn { border:1px solid rgba(255,255,255,.10); background:rgba(255,255,255,.05); color:#cfd8ea;
    font-size:13px; letter-spacing:1px; padding:8px 14px; border-radius:12px; cursor:pointer;
    transition:all .22s ease; white-space:nowrap; }
  .mbtn:hover { background:rgba(255,255,255,.13); transform:translateY(-1px); }
  .mbtn.active { background:linear-gradient(135deg,rgba(99,102,241,.85),rgba(168,85,247,.85));
    border-color:rgba(180,160,255,.6); color:#fff; box-shadow:0 4px 18px rgba(139,92,246,.45); }

  #tools { display:flex; align-items:center; gap:14px; padding:8px 16px; }
  .titem { display:flex; align-items:center; gap:8px; color:#aeb9d2; font-size:12px; letter-spacing:1px; }
  input[type=color] { width:34px; height:26px; border:none; border-radius:8px; background:transparent;
    cursor:pointer; padding:0; }
  input[type=color]::-webkit-color-swatch-wrapper { padding:0; }
  input[type=color]::-webkit-color-swatch { border:1px solid rgba(255,255,255,.25); border-radius:8px; }
  .ibtn { width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    border-radius:10px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.06);
    color:#dfe6f5; cursor:not-allowed; opacity:0.4; transition:all .2s; }
  .ibtn svg { width:17px; height:17px; fill:currentColor; }
  .ibtn.on { background:rgba(94,234,212,.18); border-color:rgba(94,234,212,.5); color:#5eead4; }

  /* ---------- 手势提示（修改文案为鼠标指南） ---------- */
  #hint { position:fixed; left:22px; bottom:22px; z-index:10; color:#8fa0c0; font-size:11.5px;
    line-height:1.9; letter-spacing:.5px; padding:12px 16px; pointer-events:none; }
  #hint b { color:#d6deef; font-weight:600; }
  #hint .dot { color:#5eead4; }

  /* ---------- 加载遮罩 ---------- */
  #loader { position:fixed; inset:0; z-index:50; background:#05060a; display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:18px; color:#cfd8ea;
    transition:opacity .6s ease; }
  #loader.hide { opacity:0; pointer-events:none; }
  .ring { width:46px; height:46px; border-radius:50%; border:2px solid rgba(255,255,255,.12);
    border-top-color:#8b5cf6; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loader p { font-size:13px; letter-spacing:2px; opacity:.7; }

  #toast { position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-8px); z-index:40;
    padding:9px 18px; border-radius:12px; font-size:12.5px; letter-spacing:1px; color:#e8ecf4;
    background:rgba(20,24,38,.8); border:1px solid rgba(255,255,255,.12); backdrop-filter:blur(10px);
    opacity:0; transition:all .35s ease; pointer-events:none; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:640px){
    #hint { display:none; }
    #camWrap { width:104px; }
    #brand h1 { font-size:14px; }
  }
</style>
</head>
<body>
<div id="stage"></div>

<div id="loader"><div class="ring"></div><p>正在唤醒粒子宇宙…</p></div>
<div id="toast"></div>

<div id="brand"><h1>灵动手序 · PARTICLE FLOW</h1><p>MOUSE INTERACTIVE PARTICLE UNIVERSE</p></div>

<div id="camWrap">
  <video id="video" playsinline muted></video>
  <canvas id="camCanvas" width="148" height="111"></canvas>
  <div id="camState">鼠标控制模式</div>
</div>

<div id="panel">
  <div id="models" class="glass"></div>
  <div id="tools" class="glass">
    <div class="titem">色彩 <input type="color" id="colorPick" value="#7c8cff"></div>
    <div class="titem" id="fsBtn" title="全屏">
      <div class="ibtn"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></div>
    </div>
    <div class="titem" id="camBtn" title="摄像头已禁用">
      <div class="ibtn on"><svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg></div>
    </div>
  </div>
</div>

<div id="hint" class="glass">
  <b>鼠标指南</b><br>
  <span class="dot">⬆️⬇️</span> 鼠标上下移动 —— 粒子扩散放大 · 聚合收缩<br>
  <span class="dot">⬅️➡️</span> 鼠标左右移动 —— 旋转模型<br>
  <span class="dot">🖱滚轮</span> —— 拉近拉远视角<br>
  <span class="dot">🖱拖拽</span> 额外旋转模型
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
 * 基础参数
 * ============================================================ */
const COUNT = 24000;                 // 粒子数量（细腻度）
const stage = document.getElementById('stage');

/* ============================================================
 * Three.js 场景
 * ============================================================ */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060a, 0.028);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 16);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x05060a, 1);
stage.appendChild(renderer.domElement);

const group = new THREE.Group();
scene.add(group);

/* ---------- 粒子几何体 ---------- */
const geo = new THREE.BufferGeometry();
const pos      = new Float32Array(COUNT*3);  // 当前位置
const target   = new Float32Array(COUNT*3);  // 目标位置（模型点云）
const seed     = new Float32Array(COUNT);    // 随机种子（闪烁/错相）
const scatterV = new Float32Array(COUNT*3);  // 扩散方向

for (let i=0;i<COUNT;i++){
  seed[i] = Math.random();
  const v = new THREE.Vector3().randomDirection();
  scatterV[i*3]=v.x; scatterV[i*3+1]=v.y; scatterV[i*3+2]=v.z;
  pos[i*3]=(Math.random()-0.5)*30; pos[i*3+1]=(Math.random()-0.5)*30; pos[i*3+2]=(Math.random()-0.5)*30;
}
geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
geo.setAttribute('aSeed',    new THREE.BufferAttribute(seed,1));

/* ---------- 粒子材质（自定义 shader，细腻光点） ---------- */
const mat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{
    uTime:{value:0}, uColor:{value:new THREE.Color('#7c8cff')},
    uSize:{value:1.0}, uPixel:{value:Math.min(devicePixelRatio,2)}
  },
  vertexShader:`
    attribute float aSeed;
    uniform float uTime, uSize, uPixel;
    varying float vSeed; varying float vTw;
    void main(){
      vSeed = aSeed;
      vec4 mv = modelViewMatrix * vec4(position,1.0);
      float tw = 0.72 + 0.28*sin(uTime*2.2 + aSeed*40.0);   // 微光闪烁
      vTw = tw;
      gl_PointSize = uSize * uPixel * tw * (26.0 / -mv.z) * (0.55 + aSeed*0.9);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader:`
    uniform vec3 uColor;
    varying float vSeed; varying float vTw;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      if(d>0.5) discard;
      float a = smoothstep(0.5, 0.02, d);
      a *= a;
      vec3 tint = mix(uColor, uColor*1.35+vec3(0.12), vSeed*0.55);  // 同色系明暗变化
      vec3 col  = mix(tint, vec3(1.0), smoothstep(0.18,0.0,d)*0.35); // 亮芯
      gl_FragColor = vec4(col, a * (0.55 + 0.45*vTw));
    }`
});
group.add(new THREE.Points(geo, mat));

/* ---------- 背景星尘 ---------- */
(function stars(){
  const n=900, p=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const r=38+Math.random()*40, t=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    p[i*3]=r*Math.sin(ph)*Math.cos(t); p[i*3+1]=r*Math.cos(ph)*0.6; p[i*3+2]=r*Math.sin(ph)*Math.sin(t);
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x44507a,size:0.07,transparent:true,opacity:0.7,depthWrite:false})));
})();

/* ============================================================
 * 模型点云生成（全部程序化）
 * ============================================================ */
const rnd = (a,b)=>a+Math.random()*(b-a);

function fillFrom(samples){ // samples: 采样函数，返回 [x,y,z]
  for(let i=0;i<COUNT;i++){
    const s=samples(i);
    target[i*3]=s[0]; target[i*3+1]=s[1]; target[i*3+2]=s[2];
  }
}

const Models = {

  /* ----- 爱心：3D 心形隐函数拒绝采样 ----- */
  heart(){ fillFrom(()=>{
    while(true){
      const x=rnd(-1.3,1.3), y=rnd(-1.3,1.3), z=rnd(-1.3,1.3);
      const a=x*x+2.25*y*y+z*z-1;
      if(a*a*a - x*x*z*z*z - 0.1125*y*y*z*z*z <= 0)
        return [x*4.6, z*4.6+0.6, y*4.6];
    }});
  },

  /* ----- 花朵：多层花瓣 + 花蕊 ----- */
  flower(){ fillFrom((i)=>{
    if(i<COUNT*0.16){ // 花蕊球
      const v=new THREE.Vector3().randomDirection().multiplyScalar(rnd(0,0.9));
      return [v.x, v.y+0.15, v.z];
    }
    const petals=7, layer=(Math.random()<0.5?0:1);
    const p=Math.floor(Math.random()*petals), ang=p/petals*Math.PI*2 + layer*0.45;
    const u=Math.random(), v=(Math.random()*2-1);
    const len=3.4-layer*0.9, width=Math.sin(u*Math.PI)*(1.15-layer*0.25);
    const bend=Math.sin(u*Math.PI*0.62)*(1.5-layer*0.5);
    const r=0.4+u*len, w=v*width;
    const x=Math.cos(ang)*r - Math.sin(ang)*w;
    const z=Math.sin(ang)*r + Math.cos(ang)*w;
    const y=bend - u*u*1.1 + rnd(-0.05,0.05);
    return [x, y-1.0, z];
  });},

  /* ----- 土星：球体 + 光环 ----- */
  saturn(){ fillFrom((i)=>{
    if(i<COUNT*0.55){
      const v=new THREE.Vector3().randomDirection().multiplyScalar(2.6+rnd(-0.03,0.03));
      return [v.x, v.y, v.z];
    }
    const r=rnd(3.6,6.2), t=Math.random()*Math.PI*2;
    const band=Math.sin(r*5.0)*0.12;
    return [Math.cos(t)*r, rnd(-0.06,0.06)+band*0.2, Math.sin(t)*r];
  });},

  /* ----- 烟花：球面爆发方向（动画驱动） ----- */
  fireworks(){ fillFrom(()=>{
    const v=new THREE.Vector3().randomDirection();
    const s=Math.pow(Math.random(),0.4);
    return [v.x*s, v.y*s, v.z*s];   // 单位方向*随机量，动画中乘半径
  });},

  /* ----- 地球：斐波那契球 + 大陆噪声起伏 ----- */
  earth(){
    const R=4.2, ga=Math.PI*(3-Math.sqrt(5));
    const pts=[];
    for(let i=0;i<COUNT;i++){
      const y=1-(i/(COUNT-1))*2, rad=Math.sqrt(1-y*y), th=ga*i;
      let x=Math.cos(th)*rad, z=Math.sin(th)*rad;
      const n=Math.sin(x*3.1+z*1.7)*Math.sin(y*4.3+x*2.2)*Math.sin(z*2.9-y*1.3);
      const rr=R+(n>0.18?0.35:0)+rnd(-0.015,0.015);
      pts.push([x*rr,y*rr,z*rr]);
    }
    for(let i=0;i<COUNT;i++){ target[i*3]=pts[i][0]; target[i*3+1]=pts[i][1]; target[i*3+2]=pts[i][2]; }
  },

  /* ----- 千里江山：层叠山峦 ----- */
  mountains(){
    const ridge=(x,li)=>{
      return (Math.sin(x*0.55+li*1.7)*1.6 + Math.sin(x*1.35+li*3.1)*0.9
             + Math.sin(x*2.6+li*0.8)*0.45 + Math.sin(x*0.22+li*4.2)*2.0)
             * (1.0+li*0.22);
    };
    fillFrom(()=>{
      const layer=Math.floor(Math.random()*5);          // 5 重山
      const x=rnd(-9,9);
      const h=ridge(x,layer)+2.2;
      const t=Math.pow(Math.random(),1.8);              // 靠近山脊更密
      const z=-7+layer*3.4 + rnd(-0.25,0.25);
      return [x, h*t-3.6+rnd(-0.04,0.04), z];
    });
  },

  /* ----- 昙花：深夜绽放的层叠狭瓣 ----- */
  epiphyllum(){ fillFrom((i)=>{
    if(i<COUNT*0.10){ // 花心丝蕊
      const a=Math.random()*Math.PI*2, r=Math.random()*0.5, l=rnd(0.4,1.6);
      return [Math.cos(a)*r, l-1.4, Math.sin(a)*r];
    }
    const rings=[{n:9,len:4.6,b:0.35},{n:7,len:3.6,b:0.75},{n:5,len:2.6,b:1.15}];
    const ring=rings[Math.floor(Math.random()*3)];
    const p=Math.floor(Math.random()*ring.n), ang=p/ring.n*Math.PI*2+rnd(-0.05,0.05);
    const u=Math.random(), v=(Math.random()*2-1);
    const width=Math.sin(u*Math.PI)*0.5*(1-u*0.4);
    const curve=Math.sin(u*Math.PI*0.5)*ring.b;         // 花瓣外翻弯曲
    const r=0.25+u*ring.len;
    const x=Math.cos(ang)*r - Math.sin(ang)*v*width;
    const z=Math.sin(ang)*r + Math.cos(ang)*v*width;
    const y=curve*2.0 - u*u*0.7 - 1.4;
    return [x, y, z];
  });}
};

const modelDefs=[
  {id:'heart',     name:'❤ 爱心'},
  {id:'flower',    name:'❀ 花朵'},
  {id:'saturn',    name:'♄ 土星'},
  {id:'fireworks', name:'✦ 烟花'},
  {id:'earth',     name:'🌍 地球'},
  {id:'mountains', name:'⛰ 千里江山'},
  {id:'epiphyllum',name:'✾ 昙花'}
];

let currentModel='heart';
function setModel(id){
  currentModel=id;
  Models[id]();
  document.querySelectorAll('.mbtn').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
}

/* ---------- 模型按钮 ---------- */
const modelsBar=document.getElementById('models');
modelDefs.forEach(m=>{
  const b=document.createElement('button');
  b.className='mbtn'; b.dataset.id=m.id; b.textContent=m.name;
  b.onclick=()=>{ setModel(m.id); toast('已切换 · '+m.name.replace(/^\S+\s/,'')); };
  modelsBar.appendChild(b);
});

/* ============================================================
 * 鼠标替代手势识别（删除MediaPipe全套逻辑）
 * ============================================================ */
const gesture={
  active:false,
  openness:0.6,       // 0 聚合 ~1扩散
  rotSpeed:0,
  handX:0.5, handY:0.5,
  zoom:1.0
};

// 鼠标坐标归一化 [0~1]
let mouseX=0.5, mouseY=0.5;
window.addEventListener('mousemove',(e)=>{
  mouseX = e.clientX / window.innerWidth;
  mouseY = e.clientY / window.innerHeight;
  gesture.active = true;
});
window.addEventListener('mouseleave',()=>{
  gesture.active = false;
});
window.addEventListener('wheel',(e)=>{
  gesture.zoom += e.deltaY * -0.0008;
  gesture.zoom = THREE.MathUtils.clamp(gesture.zoom,0.45,2.0);
});

/* ============================================================
 * UI 事件
 * ============================================================ */
document.getElementById('colorPick').addEventListener('input',e=>{
  mat.uniforms.uColor.value.set(e.target.value);
});
document.getElementById('fsBtn').onclick=()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
};
// 摄像头按钮禁用，无功能
document.getElementById('camBtn').onclick=()=>{
  toast('当前版本已移除摄像头手势功能');
};

let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ---------- 鼠标拖拽兜底控制 ---------- */
let dragging=false,lastX=0,lastY=0,manualRotX=0,manualRotY=0,userZoom=16;
addEventListener('pointerdown',e=>{ if(e.target.closest('#panel,#camWrap,#hint'))return; dragging=true; lastX=e.clientX; lastY=e.clientY; });
addEventListener('pointermove',e=>{
  if(!dragging)return;
  manualRotY+=(e.clientX-lastX)*0.005; manualRotX+=(e.clientY-lastY)*0.005;
  lastX=e.clientX; lastY=e.clientY;
});
addEventListener('pointerup',()=>dragging=false);
addEventListener('wheel',e=>{ userZoom=Math.min(34,Math.max(7,userZoom+e.deltaY*0.01)); });
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* ============================================================
 * 动画主循环
 * ============================================================ */
const clock=new THREE.Clock();
let spread=0.5, smoothZoom=1.0, fwTime=0;

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;

  /* ---- 鼠标映射到手势参数 ---- */
  let targetSpread, camDist;
  if(gesture.active){
    // Y轴：鼠标越靠上 openness越大，粒子扩散；越靠下聚合
    const rawOpenness = 1.0 - mouseY;
    gesture.openness += (rawOpenness - gesture.openness)*0.18;
    // X轴鼠标左右移动控制旋转速度
    gesture.rotSpeed += ((0.5-mouseX)*2.8 - gesture.rotSpeed)*0.12;

    group.rotation.y += gesture.rotSpeed*dt*2.4;
    group.rotation.x += ((mouseY-0.5)*1.1 - group.rotation.x)*0.03;
    smoothZoom += (gesture.zoom - smoothZoom)*0.1;
    camDist = 16/smoothZoom;
  }else{
    targetSpread = 0.55 + Math.sin(t*0.5)*0.18;
    group.rotation.y += dt*0.12;
    group.rotation.x += (manualRotX*0.3 - group.rotation.x)*0.04;
    group.rotation.y += manualRotY*dt*1.5; manualRotY*=0.96;
    camDist = userZoom;
  }
  targetSpread = gesture.active ? gesture.openness : targetSpread;
  spread += (targetSpread-spread)*0.08;

  /* ---- 粒子位置更新 ---- */
  const gather = 0.35 + spread*1.05;
  const scatterAmp = spread*spread*3.2;
  const lerpK = currentModel==='fireworks' ? 0.16 : 0.075;
  fwTime += dt;

  const pArr=geo.attributes.position.array;
  for(let i=0;i<COUNT;i++){
    const ix=i*3, sd=seed[i];
    let tx=target[ix], ty=target[ix+1], tz=target[ix+2];

    if(currentModel==='fireworks'){
      const cycle=(fwTime*0.55 + sd)%1;
      const r=Math.pow(cycle,0.62)*9.0;
      tx*=r; ty=ty*r - cycle*cycle*2.2; tz*=r;
    }

    const breathe=Math.sin(t*1.6+sd*25.0)*0.05;
    tx = tx*gather + scatterV[ix]  *scatterAmp*(0.5+sd) + breathe;
    ty = ty*gather + scatterV[ix+1]*scatterAmp*(0.5+sd) + Math.cos(t*1.4+sd*31.0)*0.05;
    tz = tz*gather + scatterV[ix+2]*scatterAmp*(0.5+sd) + breathe*0.6;

    pArr[ix]  += (tx-pArr[ix])*lerpK;
    pArr[ix+1]+= (ty-pArr[ix+1])*lerpK;
    pArr[ix+2]+= (tz-pArr[ix+2])*lerpK;
  }
  geo.attributes.position.needsUpdate=true;

  mat.uniforms.uTime.value=t;
  mat.uniforms.uSize.value = currentModel==='fireworks' ? 1.25 : 1.0;

  renderer.render(scene,camera);
}

/* ============================================================
 * 启动
 * ============================================================ */
setModel('heart');
animate();
// 移除摄像头启动逻辑
setTimeout(()=>document.getElementById('loader').classList.add('hide'), 900);

})();
</script>
